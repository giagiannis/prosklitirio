<!DOCTYPE html>
<html lang="el">
<head>
  <meta property="og:title" content="Προσκλητήριο βάπτισης">
  <meta property="og:description" content="Σας προσκαλούμε στη βάπτιση της κόρης μας!">
  <!--
	  <meta property="og:image" content="https://giagiannis.github.io/prosklitirio/pageB.jpg">

  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Προσκλητήριο βάπτισης</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #fdfaf6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 20px;
    }


    .card-scene {
      width: 100%;
      max-width: 680px;
      aspect-ratio: 1.414 / 1; /* Standard landscape invitation ratio */
      perspective: 1400px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.8s cubic-bezier(0.4, 0.2, 0.2, 1);
      border-radius: 12px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.12), 0 5px 15px rgba(0, 0, 0, 0.06);
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      border-radius: 12px;
      overflow: hidden;
      background-color: #ffffff;
    }

    .card-face img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-back {
      transform: rotateY(180deg);
    }

    .hint {
      margin-top: 24px;
      font-size: 14px;
      color: #7a7a7a;
      display: flex;
      align-items: center;
      gap: 6px;
      user-select: none;
    }
  </style>
</head>
<body>

  <div class="card-scene" onclick="this.querySelector('.card').classList.toggle('is-flipped')">
    <div class="card">
      <div class="card-face card-front">
        <img src="pageB.jpg" alt="You are my Sunshine">
      </div>
      <div class="card-face card-back">
        <img src="pageA.jpg" alt="Πρόσκληση Βάπτισης">
      </div>
    </div>
  </div>

  <p class="hint">
    <span>👆</span> Πατήστε πάνω στην κάρτα για να τη γυρίσετε
  </p>

</body>
</html>
